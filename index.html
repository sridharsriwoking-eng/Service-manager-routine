<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport with safe-area support -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- Theme & PWA meta -->
  <meta name="theme-color" content="#061836" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060C17" media="(prefers-color-scheme: dark)" />
  <meta name="description"
    content="Hyundai Service Manager Daily Checklist & Operations Timeline — Kovai Hyundai / SS Automarts" />

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SM Routine" />

  <!-- Android / Chrome PWA -->
  <meta name="application-name" content="SM Daily Routine" />
  <meta name="msapplication-TileColor" content="#061836" />

  <title>SM Daily Routine | Service Manager Daily Checklist</title>

  <!-- Icons & manifest -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <!-- Preconnect for Google Fonts (loaded via CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
